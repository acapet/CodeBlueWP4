# Ajust your model name
model:
  name: COHERENS 
  
# Ajust your paths
files:
  pattern: "/ec/res4/hpcperm/cvao/BGC/OUTPUTS/nos5/{year}/NoS_1.avrgd3.nc" # Model output
  stations: "~/CodeBlueWP4/src/stations/stations.csv" # ICES data
  outdir: "/ec/res4/hpcperm/cvao/BGC/OUTPUTS/nos5/" # Final tabular validations tables

# Ajust your model's coordinate names
coordinates:
  time: time
  lon: lon
  lat: lat
  vertical: lev

# GETM native vertical-coordinate mapping. Layer thickness h reconstructs
# instantaneous positive-down physical depths. GETM layers are stored from
# bottom to surface, and index 0 is inactive padding.
vertical_coordinate:
  method: existing_z
  depth_variable: z
  thickness_variable: lev
  native_order: bottom_to_surface
  positive: up
  reference: instantaneous_surface
  observation_reference: instantaneous_surface
  outside_column: missing
  missing_values:
    - -9998.0
    - -9999.0

# Ajust your model's variable names and (if necessary) the assoctiated conversion factor
derived_variables:
  chl:
    expression: "chlsc + chlnsc"
  sec:
    expression: "1 / parattcoef"
  z:
    expression: " lev * depth "

variables:
  oxy: #[ml/l]
    model_name: o2
    conversion: 22.3914  # 1000/44.66

  nox: #[µmol/l]
    model_name: no3
    conversion: 1000

  nh4: #[µmol/l]
    model_name: nh4
    conversion: 1000

  chl: #[µg/l]
    model_name: chl
    conversion: 1

  po4: #[µmol/l]
    model_name: po4
    conversion: 1000

  sio: #[µmol/l]
    model_name: sio
    conversion: 1000
    
  temp: #[°C]
    model_name: temp
    conversion: 1
    
  sal: #[-]
    model_name: sal
    conversion: 1

  ph: #[-] 
    model_name: pH
    conversion: 1
    
  talk: #[mEq/l]
    model_name: alk
    conversion: 1

  
    
  
